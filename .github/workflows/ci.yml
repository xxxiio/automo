name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: full quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync
      - name: Run canonical full-repository gate
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv and select Python
        uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync
      - name: Run unit tests
        run: uv run pytest -q

  health:
    name: package and smoke
    needs: [quality, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync
      - name: Run package health gate without repeating pytest
        run: uv run python scripts/health_gate.py --skip-tests

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync documentation dependencies
        run: uv sync --group docs
      - name: Build documentation strictly
        run: uv run --group docs zensical build --clean --strict
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-docs:
    name: deploy docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, tests, health, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
