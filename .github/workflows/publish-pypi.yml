name: publish-pypi

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag points to main HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --no-tags
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          main_commit="$(git rev-parse origin/main)"
          if [[ "${tag_commit}" != "${main_commit}" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} points to ${tag_commit}, but origin/main points to ${main_commit}."
            echo "Create the release tag from the current main commit and push the tag again."
            exit 1
          fi

      - name: Require successful CI for tagged main commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              status: 'success',
              head_sha: sha,
              per_page: 10,
            });
            if (response.data.total_count < 1) {
              core.setFailed(`No successful ci.yml push run found for tagged main commit ${sha}.`);
            }

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync locked development environment
        run: uv sync

      - name: Verify release tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package version v${VERSION}."
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build

      - name: Verify distributions
        run: |
          uvx twine check dist/*
          uv run python scripts/source_check.py

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/automo/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions-${{ github.ref_name }}
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
