[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[project]
name = "automo"
version = "0.3.0a1"
description = "Automated model optimisation and lifecycle research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Automo contributors" }]
keywords = ["model-research", "model-optimisation", "machine-learning", "automl", "workflows"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["PyYAML>=6.0", "typer>=0.16,<1"]

[project.optional-dependencies]
getdone = ["getdone-dev>=1.1.2,<2"]

[project.scripts]
automo = "automo.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.6,<5",
  "pytest>=8",
  "ruff>=0.16,<0.17",
]
docs = [
  "zensical",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = [".agent", ".venv", "build", "dist", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["automo.cli._root_option"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
