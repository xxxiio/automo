[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "automo"
version = "0.3.0a1"
description = "Automated model optimisation and lifecycle research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Automo contributors" }]
keywords = ["model-research", "model-optimisation", "machine-learning", "automl", "workflows"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["PyYAML>=6.0", "typer>=0.16,<1"]

[project.optional-dependencies]
getdone = ["getdone-dev>=1.1.2,<2"]

[project.scripts]
automo = "automo.cli:main"

[tool.poetry]
packages = [{ include = "automo", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
ruff = ">=0.16,<0.17"
pre-commit = ">=4.6,<5"
build = ">=1.2,<2"

[tool.poetry.group.docs.dependencies]
zensical = "*"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = [".agent", ".venv", "build", "dist", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
